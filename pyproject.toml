[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "trm"
version = "0.1.0"
description = "reimplementation of the tiny reasoning models paper"
authors = [
    {name = "Shane Segal", email = "shane@smsegal.ca"},
]
requires-python = ">=3.12"
dependencies = [
    "beartype>=0.22.2",
    "einops>=0.8.1",
    "jaxtyping>=0.3.3",
    "torch>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "ruff>=0.0.280",
    "pyright>=1.1.380",
    "pre-commit>=3.0.0",
]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # isort
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "N",   # pep8-naming
    "PL",  # pylint
    "RUF", # ruff-specific rules
]
ignore = [
    "E501",  # line too long, handled by ruff
    "E203",  # whitespace before ':', handled by ruff
    "N812",  # allow torch.nn.functional as F alias
    "PLR0913" # too many function arguments
]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.isort]
known-first-party = ["trm"]

[tool.ruff.lint.pep8-naming]
ignore-names = ["F"]

[tool.ruff.lint.per-file-ignores]
"src/trm/model.py" = ["F722"]
"tests/test_model.py" = ["I001"]

[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "standard"
reportMissingTypeStubs = false
venvPath = "."
venv = ".venv"
include = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
addopts = "-v --cov=src --cov-report=term-missing"

[tool.coverage.run]
source = ["src"]
omit = ["*/__init__.py", "*/tests/*"]

[dependency-groups]
dev = [
    "basedpyright>=1.31.7",
    "ruff>=0.14.0",
]
test = [
    "pytest>=8.4.2",
]
